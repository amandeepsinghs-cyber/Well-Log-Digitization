[project]
name = "log-digitiser"
version = "0.1.0"
description = "Well Log Digitisation Agent - Automated Petrophysical Well Log Digitisation & Interactive Multi-Track A2UI Visualization for Gemini Enterprise"
authors = [
    {name = "Amandeep Singh", email = "amandeepsinghs@google.com"},
]

dependencies = [
    "google-adk[gcp,otel-gcp]>=2.6.0,<3.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "gcsfs>=2024.11.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-storage>=2.18.0,<4.0.0",
    "google-cloud-aiplatform[evaluation,agent-engines]>=1.156.0",
    "protobuf>=6.31.1,<7.0.0",
    "lasio>=0.31,<1.0",
    "numpy>=1.26,<3.0",
    "opencv-python-headless>=5.0.0.93",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "pillow>=12.3.0",
    "pypdfium2>=5.13.0",
]
requires-python = ">=3.11,<3.14"


[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    # Validates A2UI components against the pinned Gemini Enterprise catalog
    # before deployment. See tests/unit/test_a2ui_catalog_validation.py.
    "jsonschema>=4.20.0,<5.0.0",
    "matplotlib>=3.11.2",
    "vl-convert-python>=1.9.0.post1",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.6.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006"] # ignore line too long, too complex

[tool.ruff.lint.isort]
known-first-party = ["app", "frontend"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
# Ignore common issues with third-party libraries and dynamic code patterns
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
ignore-words-list = "rouge"
skip = "./locust_env/*,uv.lock,.venv,./frontend,**/package-lock.json"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["app","frontend"]


